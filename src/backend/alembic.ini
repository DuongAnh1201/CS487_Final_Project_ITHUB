# Alembic migrations for PostgreSQL (Supabase). SQLite (local runs, tests) builds tables from the models.
# The app applies migrations on startup; from src/backend you can also run them by hand:
#   ITHUB_DATABASE_URL=postgresql://... .venv/bin/alembic upgrade head
#   ITHUB_DATABASE_URL=postgresql://... .venv/bin/alembic revision --autogenerate -m "add x to y"

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

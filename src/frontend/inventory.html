<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/brand/it-hub-icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/it-hub-icon-192.png">
<title>IT Hub · Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F5F2;font-family:'Inter',system-ui,sans-serif;color:#181818;font-size:14px}
*{box-sizing:border-box}
a{color:#1F6B7A;text-decoration:none}a:hover{color:#144852;text-decoration:underline}
.nav{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:#3D4756;font-weight:600;font-size:13px;border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none!important}
.nav:hover{color:#1F4D3A;background:#F4F8F5}
.nav.on{color:#1F4D3A;border-bottom-color:#7CC4A0;background:#EEF7F2}
.card{background:#fff;border:1px solid #DCE1E8;border-radius:8px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid #E6EAF0;flex-wrap:wrap}
.card-t{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:6px;border:1px solid #C9D1DC;background:#fff;color:#1F6B7A;font:600 13px 'Inter',sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none!important}
.btn:hover{background:#F2F7F4}
.btn-brand{background:#BFE3D0;border-color:#A3D3BA;color:#173F2D}.btn-brand:hover{background:#ACDAC2;color:#173F2D}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:8px;border:0;background:transparent;color:#3D4756;cursor:pointer;position:relative}
.ib:hover{background:#F2F7F4}
.b{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.b-good{background:#DDF2E6;color:#1F5A3B}.b-warn{background:#FCEBCF;color:#7A4A00}.b-bad{background:#FBDDE0;color:#8A1C2B}.b-neutral{background:#EDF0F4;color:#3D4756}.b-info{background:#DCEBF9;color:#1C4E7A}.b-final{background:#E7E0F5;color:#4A3577}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:#5A6472;background:#F7F9FB;padding:10px 16px;border-bottom:1px solid #DCE1E8;white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid #EDF0F4;white-space:nowrap}
.input{width:100%;min-height:38px;padding:8px 10px;border:1px solid #C9D1DC;border-radius:6px;font:14px 'Inter',sans-serif;color:#181818;background:#fff}
.lbl{display:block;font-size:12px;font-weight:600;color:#3D4756;margin-bottom:6px}
.muted{color:#5A6472}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tile{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.tab{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;margin-right:20px;color:#3D4756;font-weight:600;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none!important}
.tab.on{color:#1F4D3A;border-bottom-color:#7CC4A0}
.seg{display:inline-flex;border:1px solid #C9D1DC;border-radius:6px;overflow:hidden}
.seg button{min-height:36px;padding:0 12px;border:0;border-right:1px solid #C9D1DC;background:#fff;font:600 13px 'Inter',sans-serif;color:#3D4756;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:#BFE3D0;color:#173F2D}

/* Live views use the mockup geometry; only functional view/form hooks are added. */
.page-title{display:flex;align-items:center;gap:14px;padding:16px 20px;flex-wrap:wrap}
.page-title h1{margin:2px 0 0;font-size:22px;font-weight:800;color:#2B2F36}
.page-title>div:not(.toolbar){flex:1 1 240px}.page-title>.toolbar{flex:0 0 auto}.page-title .muted{font-size:12px;font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.views{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.primary{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:16px}
.side{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:16px}
.fields{padding:16px;display:flex;flex-direction:column;gap:14px}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px 16px;border-bottom:1px solid #E6EAF0;align-items:center}
.filter-grid .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.search-field{position:relative;grid-column:span 2}.search-field .input{padding-right:38px}.search-field button{position:absolute;right:1px;top:1px;width:36px;min-height:36px;padding:0;border:0;background:transparent;color:#1F6B7A;cursor:pointer}
.detail-grid{margin:0;padding:14px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;font-size:13px;overflow-wrap:anywhere}
.detail-grid dd{margin:2px 0 0;font-weight:600;white-space:pre-wrap}
.low-stock{background:#FFF8F8}.selected-record{background:#F2F7F4}
.btn:disabled{opacity:.55;cursor:default}td .btn{min-height:30px;padding:0 9px}
.form-help{padding:10px 12px;margin:0;background:#DCEBF9;border-radius:6px;color:#1C4E7A;font-size:13px;line-height:1.5}
.list-meta{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px}.list-meta .btn{min-height:28px;padding:0 8px;font-size:12px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat strong{font-size:24px;font-weight:800}.stat .muted{font-size:12px;font-weight:600}
.nrow a{white-space:normal;overflow-wrap:anywhere}.read-toggle{min-height:28px;padding:0 8px;font-size:12px}
@media(max-width:500px){.search-field{grid-column:span 1}.filter-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr 1fr}}
</style>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
<header style="background:#fff;border-bottom:1px solid #DCE1E8">
<div style="display:flex;align-items:center;gap:16px;padding:8px 20px;flex-wrap:wrap">
<a href="index.html" style="display:flex;align-items:center;text-decoration:none" aria-label="IT Hub home"><img src="assets/brand/it-hub-logo-horizontal.svg" alt="IT Hub" style="height:38px;width:auto;display:block"></a>
<div style="flex:1 1 280px;display:flex;justify-content:center">
<label style="position:relative;width:100%;max-width:560px;display:block"><span class="sr">Search IT Hub</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2" stroke-linecap="round" style="position:absolute;left:12px;top:11px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input class="input" type="search" placeholder="Search this page" id="header-search" style="padding-left:36px;background:#F7F9FB"></label>
</div>
<div style="display:flex;align-items:center;gap:4px">
<a class="ib" href="notifications.html" aria-label="Notifications"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span style="position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#F7C5CB;color:#7A1626;font-size:11px;font-weight:700;display:grid;place-items:center" hidden>0</span></a>
<a href="admin.html" aria-label="My account" style="width:36px;height:36px;border-radius:50%;background:#FBD9C4;color:#6B3418;display:grid;place-items:center;font-weight:700;font-size:13px;margin-left:6px;text-decoration:none">…</a>
</div>
</div>
<nav aria-label="Main" style="display:flex;gap:2px;padding:0 12px;overflow-x:auto;border-top:1px solid #EDF0F4">
<a class="nav" href="index.html">Home</a>
<a class="nav on" href="inventory.html" aria-current="page">Inventory</a>
<a class="nav" href="classrooms.html">Classrooms</a>
<a class="nav" href="issues.html">Issues</a>
<a class="nav" href="projects.html">Projects</a>
<a class="nav" href="orders.html">Orders</a>
<a class="nav" href="reports.html">Reports</a>
<a class="nav" href="admin.html">Audit log</a>
<a class="nav" href="admin.html">Admin</a>
</nav>
</header>

<main style="flex:1;width:100%;max-width:1400px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px">
<section class="card"><div class="page-title"><span class="tile" style="background:#CDEBE0;color:#1F5A4B"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></span><div style="flex:1 1 240px"><div class="muted">Inventory</div><h1>Equipment</h1></div><div class="toolbar"><button class="btn" data-create="incident">Report incident</button><button class="btn" data-create="lend">Lend an item</button><button class="btn btn-brand" data-create="item"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Register equipment</button></div></div><nav id="inventory-tabs" aria-label="Inventory sections" style="display:flex;padding:0 20px;overflow-x:auto;border-top:1px solid #EDF0F4"></nav></section>
<div class="views"><div class="primary"><section id="list-card" class="card"><p class="empty" role="status">Loading inventory…</p></section><section id="consumable-card" class="card" hidden></section></div><aside class="side"><section id="editor" class="card" hidden></section><section id="record" class="card" hidden></section></aside></div>
</main>
</div>
<script type="module" src="assets/js/pages/inventory.js"></script>
</body>
</html>

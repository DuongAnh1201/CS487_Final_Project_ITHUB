<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F5F2;font-family:'Inter',system-ui,sans-serif;color:#181818;font-size:14px}
*{box-sizing:border-box}
a{color:#1F6B7A;text-decoration:none}a:hover{color:#144852;text-decoration:underline}
.nav{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:#3D4756;font-weight:600;font-size:13px;border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none!important}
.nav:hover{color:#1F4D3A;background:#F4F8F5}
.nav.on{color:#1F4D3A;border-bottom-color:#7CC4A0;background:#EEF7F2}
.card{background:#fff;border:1px solid #DCE1E8;border-radius:8px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid #E6EAF0;flex-wrap:wrap}
.card-t{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:6px;border:1px solid #C9D1DC;background:#fff;color:#1F6B7A;font:600 13px 'Inter',sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none!important}
.btn:hover{background:#F2F7F4}
.btn-brand{background:#BFE3D0;border-color:#A3D3BA;color:#173F2D}.btn-brand:hover{background:#ACDAC2;color:#173F2D}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:8px;border:0;background:transparent;color:#3D4756;cursor:pointer;position:relative}
.b{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.b-good{background:#DDF2E6;color:#1F5A3B}.b-warn{background:#FCEBCF;color:#7A4A00}.b-bad{background:#FBDDE0;color:#8A1C2B}.b-neutral{background:#EDF0F4;color:#3D4756}.b-info{background:#DCEBF9;color:#1C4E7A}.b-final{background:#E7E0F5;color:#4A3577}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:#5A6472;background:#F7F9FB;padding:10px 16px;border-bottom:1px solid #DCE1E8;white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid #EDF0F4;white-space:nowrap}
.input{width:100%;min-height:38px;padding:8px 10px;border:1px solid #C9D1DC;border-radius:6px;font:14px 'Inter',sans-serif;color:#181818;background:#fff}
.lbl{display:block;font-size:12px;font-weight:600;color:#3D4756;margin-bottom:6px}
.muted{color:#5A6472}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tile{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.path{display:flex;gap:4px;overflow-x:auto}
.step{flex:1 0 120px;display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 18px;font-size:13px;font-weight:600;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.step:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);border-radius:18px 0 0 18px}
.step:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,12px 50%);border-radius:0 18px 18px 0}
.done{background:#DDF2E6;color:#1F5A3B}.cur{background:#BFE3D0;color:#173F2D}.next{background:#EDF0F4;color:#3D4756}
.seg{display:inline-flex;border:1px solid #C9D1DC;border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{min-height:34px;padding:0 10px;border:0;border-right:1px solid #C9D1DC;background:#fff;font:600 12px 'Inter',sans-serif;color:#3D4756;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:#BFE3D0;color:#173F2D}
.col{flex:1 1 280px;min-width:0;background:#F1F0EC;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tcard{background:#fff;border:1px solid #E3E1DA;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;border:2px solid #fff;margin-left:-6px}
.prog{height:8px;border-radius:4px;background:#ECEAE4;overflow:hidden}
.prog span{display:block;height:100%;background:#7CC4A0;border-radius:4px}
</style>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/workflows.css">
</head>

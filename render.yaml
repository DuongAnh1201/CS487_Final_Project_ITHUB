# Render Blueprint (https://render.com/docs/blueprint-spec): one web service serves the API and the
# frontend (/app). The database is Supabase PostgreSQL (see docs/DEPLOY.md). Secrets marked
# `sync: false` are typed into the Render dashboard when the Blueprint is created, never committed.
services:
  - type: web
    name: ithub
    runtime: python
    plan: free
    buildCommand: pip install -r src/backend/requirements.txt
    startCommand: cd src/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: ITHUB_SECRET_KEY
        generateValue: true
      - key: ITHUB_DATABASE_URL # Supabase "Session pooler" connection string
        sync: false
      - key: ITHUB_ADMIN_PASSWORD # first Admin's temporary password (changed at first login)
        sync: false
      - key: ITHUB_APP_BASE_URL # https://<service>.onrender.com/app, used in email links
        sync: false
      # Optional: leave empty to keep email / Google sign-in off.
      - key: ITHUB_RESEND_API_KEY
        sync: false
      - key: ITHUB_EMAIL_FROM
        sync: false
      - key: ITHUB_RESEND_WEBHOOK_SECRET
        sync: false
      # Google sign-in through Firebase (public web-app values, see docs/DEPLOY.md).
      - key: ITHUB_FIREBASE_PROJECT_ID
        value: it-hub-a7cf9
      - key: ITHUB_FIREBASE_API_KEY
        value: AIzaSyBcLbZiRoLhVPhB1xUZO-xSVAt9JUC7S3c
      - key: ITHUB_FIREBASE_AUTH_DOMAIN
        value: it-hub-a7cf9.firebaseapp.com
      - key: ITHUB_FIREBASE_APP_ID
        value: 1:295459341438:web:c4ff539f0a207accd3442f
      - key: ITHUB_GOOGLE_HOSTED_DOMAIN # optional: sfbu.edu to allow school emails only
        sync: false
